[project]
name = "python-job-scraper"
version = "0.3.0"
description = "Multi-platform job scraping library"
authors = [{name="sarankirthic", email="sarankirthic@gmail.com"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31",
    "tls-client>=1.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "markdownify>=0.11",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "ddgs",
]

[project.optional-dependencies]
dev = [
    "black",
    "pre-commit",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobscraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits live external sites (deselect with -m 'not integration')",
]

[tool.black]
line-length = 88
target-version = ["py313"]
